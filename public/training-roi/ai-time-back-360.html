<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Time-Back 360 · Technoedge</title>
<meta name="description" content="India's first ROI Measurement tool for Trainings. Made in India by Technoedge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: clean console. White top bar with nav and actions; content in one wide column of large tiles.
   Navy = brand, gold = rewards, green-teal = "after / with AI", slate = "before". Big type everywhere. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#0F1A2B; --muted:#56637A; --line:#DFE5EE; --soft:#EDF1F7;
  --navy:#00366F; --navy2:#0B4C8C; --on-navy:#FFFFFF; --on-navy-2:#BCD0EA;
  --gold:#B07A12; --gold-2:#E2AE45; --gold-soft:#FBF1DC; --gold-ink:#6E4A07;
  --teal:#0A5DC2; --teal-soft:#E3EEFB; --before:#9AA7BA; --before-soft:#E9EDF3;
  --good:#1E8E4A; --warn:#A35F00; --bad:#D32F2F; --bad-soft:#FBE4E1;
  --saffron:#FF9933; --indgreen:#138808;
  --display:"Noto Sans","Segoe UI",Arial,sans-serif;
  --body:"Noto Sans","Segoe UI",Arial,sans-serif;
  --num:"Noto Sans","Segoe UI",Arial,sans-serif;
  --brand:#0A5DC2; --c2:#7FA8D9; --amber:#E39B00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111B; --surface:#131B28; --ink:#E7EDF5; --muted:#9AA7BA; --line:#26334A; --soft:#1A2434;
  --navy:#0B1C3B; --navy2:#16305A; --on-navy:#FFFFFF; --on-navy-2:#A9BCD8;
  --gold:#E2AE45; --gold-2:#F0C66E; --gold-soft:#33280F; --gold-ink:#F3D08A;
  --teal:#5EA2F0; --teal-soft:#132B4A; --brand:#5EA2F0; --c2:#3D6A9E; --amber:#F2B233; --before:#5D6C84; --before-soft:#1E2838;
  --good:#4CC27E; --warn:#E8A94C; --bad:#F2837B; --bad-soft:#3A1E1C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B111B; --surface:#131B28; --ink:#E7EDF5; --muted:#9AA7BA; --line:#26334A; --soft:#1A2434;
  --navy:#0B1C3B; --navy2:#16305A; --on-navy:#FFFFFF; --on-navy-2:#A9BCD8;
  --gold:#E2AE45; --gold-2:#F0C66E; --gold-soft:#33280F; --gold-ink:#F3D08A;
  --teal:#5EA2F0; --teal-soft:#132B4A; --brand:#5EA2F0; --c2:#3D6A9E; --amber:#F2B233; --before:#5D6C84; --before-soft:#1E2838;
  --good:#4CC27E; --warn:#E8A94C; --bad:#F2837B; --bad-soft:#3A1E1C; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img,svg{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; padding-inline:16px; padding-block:0; margin:0}
h1,h2,h3,h4{font-family:var(--display); margin:0; letter-spacing:-.015em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--teal); outline-offset:2px}
.num{font-family:var(--num); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1320px; margin:0 auto; display:flex; flex-direction:column; gap:22px; padding-block:20px 60px}

/* Top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); border-bottom:1px solid var(--line); margin-inline:-16px; padding-inline:16px}
.top-in{max-width:1320px; margin:0 auto; display:flex; align-items:center; gap:18px; min-height:68px; flex-wrap:wrap; padding-block:8px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:800; font-size:19px; white-space:nowrap}
.mark{width:38px; height:38px; border-radius:11px; background:var(--navy); display:grid; place-items:center; flex:none}
.mark svg{width:24px; height:24px}
.nav{display:flex; gap:4px; flex:1; overflow-x:auto}
.nav button{border:0; background:transparent; padding:10px 14px; border-radius:10px; font-weight:700; font-size:15px; color:var(--muted); cursor:pointer; white-space:nowrap}
.nav button:hover{background:var(--soft); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--navy); color:var(--on-navy)}
.who{display:flex; align-items:center; gap:10px}
.who b{display:block; font-size:14.5px; line-height:1.2}
.who small{display:block; color:var(--muted); font-size:12.5px}
.av{width:40px; height:40px; border-radius:50%; overflow:hidden; flex:none; background:var(--soft)}
.av svg{width:100%; height:100%; display:block}
.av.lg{width:72px; height:72px}
.av.xl{width:96px; height:96px; border:4px solid var(--surface)}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:15.5px; padding:12px 18px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--teal); border-color:var(--teal); color:#FFFFFF}
.btn.navy{background:var(--navy); border-color:var(--navy); color:var(--on-navy)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#FFFFFF}
.btn.ghost{background:transparent}
.btn.big{font-size:18px; padding:16px 26px; border-radius:14px}
.btn.sm{font-size:13.5px; padding:8px 12px; border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
:root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .btn.gold{color:#08130F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary, :root:not([data-theme="light"]) .btn.gold{color:#08130F}}

/* Cards and tiles */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; display:flex; flex-direction:column; gap:16px; min-width:0}
.card h3{font-size:20px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.sec-h{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.sec-h h2{font-size:24px}
.eyebrow{font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:var(--muted)}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:6px; min-width:0}
.tile .big{font-family:var(--num); font-size:40px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.tile .lbl{font-size:15px; font-weight:700}
.tile .sub{font-size:13.5px; color:var(--muted)}
.tile.navy{background:var(--navy); border-color:var(--navy); color:var(--on-navy)} .tile.navy .sub{color:var(--on-navy-2)}
.tile.gold{background:var(--gold-soft); border-color:transparent} .tile.gold .big, .tile.gold .lbl{color:var(--gold-ink)}
.tile.teal{background:var(--teal-soft); border-color:transparent} .tile.teal .big{color:var(--teal)}
.delta{display:inline-flex; align-items:center; gap:4px; font-weight:800; font-size:14px; padding:3px 9px; border-radius:999px; background:var(--teal-soft); color:var(--teal); width:max-content}
.delta.neg{background:var(--bad-soft); color:var(--bad)}
.ba{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.ba .from{font-family:var(--num); font-size:22px; color:var(--muted); text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:color-mix(in srgb, var(--muted) 50%, transparent)}
.ba .arrow{color:var(--muted); font-size:20px}
.ba .to{font-family:var(--num); font-size:40px; font-weight:600; letter-spacing:-.02em}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; padding:5px 11px; border-radius:999px; background:var(--soft); color:var(--muted); white-space:nowrap}
.chip.teal{background:var(--teal-soft); color:var(--teal)} .chip.gold{background:var(--gold-soft); color:var(--gold-ink)} .chip.navy{background:var(--navy); color:var(--on-navy)} .chip.warn{background:color-mix(in srgb, var(--warn) 15%, transparent); color:var(--warn)} .chip.bad{background:var(--bad-soft); color:var(--bad)}
.banner{background:var(--gold-soft); color:var(--gold-ink); border-radius:14px; padding:14px 18px; font-weight:700}
.note{background:var(--soft); border-radius:12px; padding:12px 14px; font-size:14.5px; color:var(--muted)}

/* Login */
.login{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:28px; max-width:1180px; margin:0 auto; padding-block:36px 60px; align-items:stretch}
.pitch{background:var(--navy); color:var(--on-navy); border-radius:26px; padding:40px; display:flex; flex-direction:column; gap:22px; position:relative; overflow:hidden}
.pitch::after{content:""; position:absolute; right:-80px; bottom:-80px; width:300px; height:300px; border-radius:50%; border:46px solid color-mix(in srgb, var(--gold-2) 25%, transparent)}
.pitch h1{font-size:44px; line-height:1.08}
.pitch p{color:var(--on-navy-2); font-size:18px; max-width:44ch}
.pitch .stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; position:relative; z-index:1}
.pitch .stats div{background:var(--navy2); border-radius:16px; padding:16px}
.pitch .stats b{font-family:var(--num); font-size:28px; display:block}
.pitch .stats small{color:var(--on-navy-2); font-size:13.5px}
.mii{display:inline-flex; align-items:center; gap:12px; background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 16px 8px 10px; font-weight:800; width:max-content; position:relative; z-index:1}
.tri{display:flex; flex-direction:column; width:26px; height:18px; border-radius:3px; overflow:hidden; flex:none}
.tri i{flex:1} .tri i:nth-child(1){background:var(--saffron)} .tri i:nth-child(2){background:#FFFFFF; position:relative} .tri i:nth-child(3){background:var(--indgreen)}
.tri i:nth-child(2)::after{content:""; position:absolute; left:50%; top:50%; width:4px; height:4px; border-radius:50%; background:#0A2A8A; transform:translate(-50%,-50%)}
.lcard{background:var(--surface); border:1px solid var(--line); border-radius:26px; padding:36px; display:flex; flex-direction:column; gap:18px; justify-content:center}
.lcard h2{font-size:30px}
.profile-page[hidden]{display:none}
.profile-page{scroll-margin-top:24px; padding-top:36px; border-top:1px solid var(--line)}
.profile-page .profile-pitch{min-height:700px}
.profile-page .profile-form-card{justify-content:flex-start}
.profile-page .profile-form-card h2{font-size:30px}
label.f{display:flex; flex-direction:column; gap:7px; font-weight:700; font-size:14.5px; min-width:0}
input,select,textarea{font:inherit; font-size:17px; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--teal); outline:none}
textarea{min-height:300px; resize:vertical; line-height:1.6}
.demo{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.demo button{display:flex; align-items:center; gap:10px; text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:14px; padding:10px 12px; cursor:pointer}
.demo button:hover{border-color:var(--teal)}
.demo b{display:block; font-size:14.5px} .demo small{color:var(--muted); font-size:12.5px}
.err{color:var(--bad); font-weight:700; font-size:14.5px}

/* Home */
.hello{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; background:var(--navy); color:var(--on-navy); border-radius:24px; padding:26px 28px}
.hello h1{font-size:34px}
.hello .lv{display:flex; flex-direction:column; gap:8px; margin-top:10px; max-width:520px}
.xpbar{height:12px; border-radius:8px; background:color-mix(in srgb, var(--on-navy) 18%, transparent); overflow:hidden}
.xpbar i{display:block; height:100%; background:linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius:8px}
.hello small{color:var(--on-navy-2); font-size:14px}
.rounds{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.rcard{border-radius:18px; padding:20px; border:2px solid var(--line); background:var(--surface); display:flex; flex-direction:column; gap:10px}
.rcard.done{border-color:var(--teal)} .rcard[data-rn]{cursor:pointer} .rcard.shown{box-shadow:0 0 0 4px var(--teal-soft)} .rcard.live{border-color:var(--gold-2); background:var(--gold-soft)}
.rcard .t{font-family:var(--display); font-size:21px; font-weight:800}
.rcard .meta{display:flex; gap:16px; flex-wrap:wrap; font-size:14px; color:var(--muted)}
.rcard .meta b{font-family:var(--num); color:var(--ink); font-size:20px; display:block}
.tasks{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.task{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:12px; cursor:pointer; text-align:left; min-width:0}
.task:hover{border-color:var(--teal)}
.task .no{font-weight:800; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal)}
.task h3{font-size:22px}
.task .fmt{display:flex; gap:8px; flex-wrap:wrap}
.task .bot{display:flex; justify-content:space-between; align-items:center; margin-top:auto}
.stars{display:inline-flex; gap:3px} .stars svg{width:20px; height:20px}
.wins{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.win{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px; min-width:0}
.win b{display:block; font-size:15px; line-height:1.25} .win small{display:block; color:var(--muted); font-size:13px}
.win .pc{margin-left:auto; font-family:var(--num); font-weight:700; color:var(--teal); font-size:18px}

/* Play */
.playbar{position:sticky; top:calc(68px + env(safe-area-inset-top,0px)); z-index:5; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; box-shadow:0 8px 24px rgba(15,26,43,.06)}
.playbar h2{font-size:22px}
.clock{font-family:var(--num); font-size:34px; font-weight:600; font-variant-numeric:tabular-nums; padding:4px 14px; border-radius:12px; background:var(--soft)}
.clock.over{background:var(--gold-soft); color:var(--gold-ink)}
.prog{display:flex; gap:6px} .prog i{width:26px; height:8px; border-radius:6px; background:var(--soft)} .prog i.d{background:var(--teal)} .prog i.c{background:var(--gold-2)}
.intro{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:20px}
.intro .hero{background:var(--navy); color:var(--on-navy); border-radius:24px; padding:32px; display:flex; flex-direction:column; gap:16px}
.intro .hero h1{font-size:40px}
.intro .hero p{color:var(--on-navy-2); font-size:19px}
.scored{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.scored div{background:var(--soft); border-radius:14px; padding:14px} .scored b{display:block; font-size:16px} .scored small{color:var(--muted); font-size:13.5px}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start}
.doc{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; white-space:pre-wrap; font-size:16px; line-height:1.65; overflow-wrap:anywhere}
.doc h3{white-space:normal; margin-bottom:10px}
.stick{position:sticky; top:calc(160px + env(safe-area-inset-top,0px))}
.qlist{display:flex; flex-direction:column; gap:14px}
.q{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px}
.q .qt{font-weight:700; font-size:17px}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{border:1.5px solid var(--line); background:var(--bg); border-radius:12px; padding:10px 14px; font-weight:600; font-size:15px; cursor:pointer; text-align:left}
.opt:hover{border-color:var(--teal)}
.opt[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:#FFFFFF}
.opt.block{width:100%}
.mail{display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
.mail .from{font-size:13.5px; color:var(--muted); font-weight:700}
.mail .subj{font-weight:800; font-size:17px}
.dtable{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{padding:11px 14px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:var(--soft)}
td.n,th.n{text-align:right; font-family:var(--num); font-variant-numeric:tabular-nums}
.line{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); cursor:pointer; text-align:left; width:100%; font-size:16px}
.line .mk{width:26px; height:26px; border-radius:8px; border:2px solid var(--line); flex:none; display:grid; place-items:center; font-weight:900; color:#FFFFFF}
.line[aria-pressed="true"]{border-color:var(--bad); background:var(--bad-soft)}
.line[aria-pressed="true"] .mk{background:var(--bad); border-color:var(--bad)}
.line[aria-pressed="true"] span.tx{text-decoration:line-through; text-decoration-color:var(--bad)}
.pickc[aria-pressed="true"]{border-color:var(--teal); background:var(--teal-soft)}
.pickc[aria-pressed="true"] .mk{background:var(--teal); border-color:var(--teal)}
.pickc[aria-pressed="true"] span.tx{text-decoration:none}
.rk{display:flex; gap:12px; align-items:center; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface)}
.rk .pos{width:36px; height:36px; border-radius:10px; background:var(--navy); color:var(--on-navy); display:grid; place-items:center; font-family:var(--num); font-weight:700; flex:none}
.rk .tx{flex:1; font-weight:600}
.rk button{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-size:18px}
.facts{background:var(--gold-soft); color:var(--gold-ink); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:8px}
.facts li{font-size:15.5px}
.facts ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px}
.wc{font-family:var(--num); font-weight:700}

/* Result */
.result{display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; align-items:center}
.ring{width:170px; height:170px; position:relative; flex:none}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .c{position:absolute; inset:0; display:grid; place-items:center; text-align:center}
.ring .c b{font-family:var(--num); font-size:46px; line-height:1; display:block}
.ring .c small{color:var(--muted); font-weight:700; font-size:13px}
.mbars{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 24px}
.mbar{display:flex; flex-direction:column; gap:6px}
.mbar .tp{display:flex; justify-content:space-between; font-weight:700}
.mbar .tp b{font-family:var(--num)}
.track{height:12px; border-radius:8px; background:var(--soft); overflow:hidden}
.track i{display:block; height:100%; border-radius:8px; background:var(--teal)}
.track i.b{background:var(--before)} .track i.g{background:var(--gold-2)}
.rv{display:flex; flex-direction:column}
.rv .it{display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; padding:12px 0; border-top:1px solid var(--line)}
.rv .it:first-child{border-top:0}
.rv .ic{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:13px; color:#FFFFFF; background:var(--good)}
.rv .ic.x{background:var(--bad)}
.rv small{color:var(--muted); display:block}

/* Leaderboard & rewards */
.podium{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:end}
.pod{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
.pod.p1{background:var(--gold-soft); border-color:transparent; padding-block:28px}
.pod .rk1{font-family:var(--display); font-weight:800; font-size:28px; color:var(--gold-ink)}
.pod b{font-size:17px} .pod .num{font-size:22px; font-weight:700}

<script>
// ===================== Geography =====================
const GEO = {
  'West':  { 'Mumbai':['Andheri','Nariman Point','Thane','Navi Mumbai'], 'Gujarat':['Ahmedabad','Surat','Vadodara','Rajkot'], 'Rest of Maharashtra':['Pune','Nashik','Nagpur'] },
  'North': { 'Delhi NCR':['Connaught Place','Gurugram','Noida'], 'Punjab & Haryana':['Ludhiana','Chandigarh','Jalandhar'], 'Rajasthan':['Jaipur','Jodhpur'], 'Uttar Pradesh':['Lucknow','Kanpur'] },
  'South': { 'Karnataka':['Bengaluru Central','Bengaluru East','Mysuru'], 'Tamil Nadu':['Chennai','Coimbatore'], 'Telangana':['Hyderabad','Secunderabad'], 'Kerala':['Kochi'] },
  'East':  { 'West Bengal':['Kolkata','Siliguri'], 'Odisha':['Bhubaneswar'], 'Bihar & Jharkhand':['Patna','Ranchi'], 'North East':['Guwahati'] },
};
const ROUNDS = [
  { n:1, name:'Base Camp', short:'Round 1', tag:'Before AI', line:'Do it your usual way, without AI.' },
  { n:2, name:'Summit',    short:'Round 2', tag:'With AI',   line:'Same kind of work, now with AI.' },
];

// ===================== Helpers =====================
function rngOf(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, seed){ const r = rngOf(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fill = (s, f) => s.replace(/\{(\w+)\}/g, (_, k) => f[k] ?? '');
const pctOf = (a, b) => b ? Math.round(a / b * 100) : 0;

// ===================== Generic scorers =====================
// Each returns { comp, acc, qual, review:[{label, ok, yours, right, why}] } with 0–100 numbers.
const SCORE = {
  sort(m, ans){
    const n = m.items.length; let done = 0, ok = 0, crit = 0, critOk = 0, critBad = 0; const review = [];
    m.items.forEach(it => { const a = ans[it.id]; if (a !== undefined) done++; const good = a === it.key; if (good) ok++;
      if (it.critical){ crit++; if (good) critOk++; else if (a === m.buckets.length - 1) critBad++; }
      review.push({ label: it.subject, ok: good, yours: a === undefined ? '—' : m.buckets[a], right: m.buckets[it.key], why: it.why }); });
    return { comp: pctOf(done, n), acc: pctOf(ok, n), qual: Math.max(0, pctOf(critOk, crit) - critBad * 20), review };
  },
  mcq(m, ans){
    const n = m.qs.length; let done = 0, ok = 0, crit = 0, critOk = 0; const review = [];
    m.qs.forEach(q => { const a = ans[q.id]; if (a !== undefined) done++; const good = a === q.key; if (good) ok++; if (q.critical){ crit++; if (good) critOk++; }
      review.push({ label: q.q, ok: good, yours: a === undefined ? '—' : q.opts[a], right: q.opts[q.key], why: q.why }); });
    return { comp: pctOf(done, n), acc: pctOf(ok, n), qual: pctOf(critOk, crit), review };
  },
  data(m, ans){
    const n = m.qs.length; let done = 0, ok = 0, exact = 0, nums = 0, rec = false; const review = [];
    m.qs.forEach(q => { const a = ans[q.id]; let good = false;
      if (q.kind === 'num'){ nums++; const v = parseFloat(String(a ?? '').replace(/[,₹\s]/g, '')); if (!isNaN(v)){ done++; good = Math.abs(v - q.key) <= (q.tol || 0); if (Math.abs(v - q.key) < 1e-6 || (q.round && Math.abs(v - q.key) <= q.round)) exact++; }
        review.push({ label: q.q, ok: good, yours: isNaN(v) ? '—' : String(a), right: String(q.key) + (q.unit ? ' ' + q.unit : ''), why: q.why }); }
      else { if (a !== undefined) done++; good = a === q.key; if (q.reco) rec = good; review.push({ label: q.q, ok: good, yours: a === undefined ? '—' : q.opts[a], right: q.opts[q.key], why: q.why }); }
      if (good) ok++; });
    return { comp: pctOf(done, n), acc: pctOf(ok, n), qual: Math.round((rec ? 50 : 0) + 50 * (nums ? exact / nums : 1)), review };
  },
  match(m, ans){
    const n = m.left.length; let done = 0, ok = 0, bad = 0, crit = null; const review = [];
    m.left.forEach(it => { const a = ans[it.id]; if (a !== undefined) done++; const good = a === it.key; if (good) ok++;
      if (a !== undefined && !good && m.opposite && m.opposite[it.key] === a) bad++;
      if (it.critical) crit = good;
      review.push({ label: it.text, ok: good, yours: a === undefined ? '—' : m.right[a], right: m.right[it.key], why: it.why }); });
    const acc = pctOf(ok, n);
    const qual = !done ? 0 : m.opposite ? Math.max(0, 100 - bad * 30 - (n - done) * 10) : Math.round((crit ? 50 : 0) + acc / 2);
    return { comp: pctOf(done, n), acc, qual, review };
  },
  write(m, ans){
    const t = (ans.text || '').trim(), words = t ? t.split(/\s+/).length : 0;
    const facts = m.facts.map(f => ({ label: f.label, ok: f.re.test(t) }));
    const rub = m.rubric.map(r => ({ label: r.label, ok: r.test(t, words) }));
    const review = [...facts.map(f => ({ label: 'Fact: ' + f.label, ok: f.ok })), ...rub.map(r => ({ label: 'Quality: ' + r.label, ok: r.ok }))];
    return { comp: Math.min(100, Math.round(words / m.min * 100)), acc: pctOf(facts.filter(f => f.ok).length, facts.length), qual: words ? pctOf(rub.filter(r => r.ok).length, rub.length) : 0, review, words };
  },
  fill(m, ans){
    const bl = m.parts.filter(p => typeof p !== 'string'); let done = 0, ok = 0, crit = 0, critOk = 0; const review = [];
    bl.forEach(b => { const a = ans[b.id]; if (a !== undefined) done++; const good = a === b.key; if (good) ok++; if (b.critical){ crit++; if (good) critOk++; }
      review.push({ label: b.label, ok: good, yours: a === undefined ? '—' : b.opts[a], right: b.opts[b.key], why: b.why }); });
    return { comp: pctOf(done, bl.length), acc: pctOf(ok, bl.length), qual: done ? pctOf(critOk, crit) : 0, review };
  },
  dialogue(m, ans){
    const n = m.turns.length; let done = 0, best = 0, bad = 0; const review = [];
    m.turns.forEach((t, i) => { const a = ans[t.id]; if (a === undefined) return; done++; const g = t.opts[a].g; if (g === 2) best++; if (g === 0) bad++;
      const right = t.opts.find(o => o.g === 2).t; review.push({ label: 'Customer: ' + t.msg, ok: g === 2, yours: t.opts[a].t, right, why: t.opts[a].why || '' }); });
    return { comp: pctOf(done, n), acc: pctOf(best, n), qual: done ? Math.max(0, 100 - bad * 35 - (n - done) * 15) : 0, review };
  },
  slot(m, ans){
    const n = m.items.length, used = {}; let placed = 0;
    m.items.forEach(it => { const a = ans[it.id]; if (a){ placed++; used[a] = (used[a] || 0) + 1; } });
    let ok = 0, clash = 0, invalid = 0; const review = [];
    m.items.forEach(it => { const a = ans[it.id]; const lockHit = a && m.slots.find(s => s.id === a)?.locked; const c = a && (used[a] > 1 || lockHit); const v = a && it.valid.includes(a);
      if (c) clash++; if (a && !v) invalid++; const good = v && !c; if (good) ok++;
      review.push({ label: it.text, ok: good, yours: a ? m.slots.find(s => s.id === a).label : 'Not placed', right: it.valid.map(x => m.slots.find(s => s.id === x).label).join(' or '), why: c ? 'Clashes with another item.' : it.why }); });
    return { comp: pctOf(placed, n), acc: pctOf(ok, n), qual: placed ? Math.max(0, 100 - clash * 30 - invalid * 15 - (n - placed) * 15) : 0, review };
  },
  spot(m, ans){
    const bad = m.lines.filter(l => l.bad), flagged = m.lines.filter(l => ans[l.id]);
    const caught = bad.filter(l => ans[l.id]).length, falseF = flagged.filter(l => !l.bad).length;
    const review = m.lines.filter(l => l.bad || ans[l.id]).map(l => ({ label: l.text, ok: !!l.bad === !!ans[l.id], yours: ans[l.id] ? 'Flagged' : 'Not flagged', right: l.bad ? 'Error' : 'Correct line', why: l.why || '' }));
    const critMiss = bad.filter(l => l.critical && !ans[l.id]).length;
    return { comp: flagged.length ? 100 : 0, acc: pctOf(caught, bad.length), qual: flagged.length ? Math.max(0, pctOf(flagged.length - falseF, flagged.length) - critMiss * 25) : 0, review };
  },
  pick(m, ans){
    const right = m.items.filter(i => i.key), picked = m.items.filter(i => ans[i.id]);
    const hit = right.filter(i => ans[i.id]).length, wrong = picked.length - hit;
    const review = m.items.filter(i => i.key || ans[i.id]).map(i => ({ label: i.text, ok: !!i.key === !!ans[i.id], yours: ans[i.id] ? 'Picked' : 'Not picked', right: i.key ? 'Real action' : 'Not an action', why: i.why || '' }));
    return { comp: Math.min(100, pctOf(picked.length, m.need)), acc: pctOf(hit, right.length), qual: picked.length ? pctOf(picked.length - wrong, picked.length) : 0, review };
  },
  rank(m, ans){
    const order = ans.order || m.start.slice(), n = m.items.length;
    if (!ans.touched) return { comp:0, acc:0, qual:0, review: order.map((id, i) => { const it = m.items.find(x => x.id === id); return { label: it.text, ok:false, yours:'Not ranked', right:'#' + (it.pos + 1), why: it.why }; }) };
    let exact = 0, d2 = 0; const review = [];
    order.forEach((id, i) => { const it = m.items.find(x => x.id === id); if (it.pos === i) exact++; d2 += (it.pos - i) ** 2;
      review.push({ label: it.text, ok: it.pos === i, yours: '#' + (i + 1), right: '#' + (it.pos + 1), why: it.why }); });
    const rho = 1 - 6 * d2 / (n * (n * n - 1));
    return { comp: ans.touched ? 100 : 40, acc: pctOf(exact, n), qual: Math.round(Math.max(0, rho) * 100), review };
  },
};

// ===================== Name pools =====================
const CUST = [
  ['Sunrise Garments LLP','Kesar Foods Pvt Ltd','Trident Chemicals Ltd','Om Polymers','Laxmi Textiles','Galaxy Auto Parts','Mehta Agro Industries','Swastik Steel Traders'],
  ['Shree Balaji Packaging','Annapurna Spices Pvt Ltd','Nova Pharma Labs','Krishna Castings','Vardhman Yarns','Pioneer Electricals','Sai Agro Exports','Royal Tiles & Sanitary'],
  ['Deccan Precision Tools','Gokul Dairy Products','Zenith Plastics','Bharat Engineering Works','Ganga Fabrics','Metro Medical Supplies','Kaveri Rice Mills','Silverline Logistics'],
];
const RMN = [
  ['Neha','Kunal','Priya','Rahul','Farhan','Deepa','Amit','Sneha'],
  ['Ananya','Rohit','Meera','Vikram','Imran','Kavya','Sanjay','Pooja'],
  ['Shreya','Arjun','Lavanya','Nikhil','Sameer','Divya','Varun','Ritika'],
];
const DATES = [ {d1:'Thursday', d2:'Friday', d3:'Monday', t:'4 pm'}, {d1:'Wednesday', d2:'Thursday', d3:'Tuesday', t:'3 pm'}, {d1:'Tuesday', d2:'Wednesday', d3:'Monday', t:'5 pm'} ];

// ===================== RM exercises =====================
const RM_EX = [
 { id:'t1', name:'Inbox Inferno', skill:'Sort your inbox', format:'Sort it', type:'sort', bench:15, work:30, freq:5,
   pitch:'10 emails just landed. Put each one in the right box. Fast.',
   build(v){ const c = CUST[v], f = { c1:c[0], c2:c[1], c3:c[2], c4:c[3], c5:c[4], c6:c[5] };

     const raw = [

       { from:'Credit Team', subject:'Query on {c2} proposal', text:'Need the latest stock statement and your comments on the dip in Q1 sales. Please reply by 4 pm today or the file goes back.', key:0, critical:true, why:'Deadline today; the file will be returned.' },
       { from:'Branch Ops', subject:'Cheque return: {c6}', text:'Second cheque return this month for {c6}. Account may slip into SMA if the overdue is not cleared in 5 days.', key:0, critical:true, why:'Portfolio risk. Call the customer now.' },
       { from:'Compliance', subject:'KYC re-verification: {c3}', text:'KYC for {c3} expires on Friday. Please collect updated documents this week.', key:1, why:'Due this week, not today.' },
       { from:'Owner, {c5}', subject:'Forex hedging discussion', text:'We have a new export order. Can we meet next week to understand hedging options?', key:1, why:'Good opportunity. Schedule it this week.' },
       { from:'Branch Ops', subject:'Stock statement received: {c4}', text:'Hard copy of the stock statement for {c4} is at the branch. Needs to be scanned and uploaded.', key:2, why:'Admin work. Ops or your assistant can do it.' },
       { from:'Relationship Associate', subject:'Courier of sanction letters', text:'Three sanction letters are ready. Shall I courier them to the registered addresses?', key:2, why:'Let the associate handle it.' },
       { from:'HR', subject:'Townhall photos', text:'Photos from last week’s townhall are now on the intranet.', key:3, why:'Nice to know. No action.' },
       { from:'Zonal Office', subject:'Monthly MIS: for information', text:'Attached is the monthly MIS for your territory, for your information.', key:3, why:'For information only.' },
       { from:'Marketing', subject:'Festive offer on POS machines', text:'New festive offer on POS machines for merchants. Brochure attached.', key:3, why:'Read when free.' },
     ];
     const items = shuffle(raw, 11 + v).map((r, i) => ({ id:'e' + i, from: fill(r.from, f), subject: fill(r.subject, f), text: fill(r.text, f), key:r.key, critical:!!r.critical, why:r.why }));
     return { type:'sort', prompt:'Read each email and choose what you will do with it.', buckets:B, items }; } },

 { id:'t2', name:'Customer X-Ray', skill:'Pre-meeting brief', format:'Quick-fire quiz', type:'mcq', bench:20, work:30, freq:3,
   pitch:'You meet this customer in 30 minutes. Read the file and nail 6 quick questions.',
   build(v){ const D = [
     { title:'Sunrise Garments LLP · Surat', body:`CRM NOTE (12 Sep): Partner Anil Kapadia called. New order from a European buyer: 40,000 pieces over 6 months. Order value about ₹6 Cr. Buyer pays in 90 days; fabric suppliers want payment in 30 days.\n\nFINANCIALS: Turnover ₹18 Cr (FY25) → ₹22 Cr (FY26). Current bank cash credit ₹1.5 Cr, fully used for 5 months.\n\nMEETING NOTE (2 Sep): Anil does the talking, but his partner Mrs Hetal Shah handles finance and signs all bank papers. She asked detailed questions on charges.\n\nBRANCH NOTE: Current account with us since 2021; average balance ₹8 lakh. One cheque return in March 2023 (cleared same day). Current bank is slow on limit enhancement.\n\nEMAIL (10 Sep, Mrs Shah): "We need a quick decision. If funding is not in place by November, we may have to refuse part of the order."`,
       qs:[
        { q:'What does the customer need most right now?', opts:['A home loan for the partners','Working capital to fund the export order','A new current account','Forex cards for travel'], key:1 },
        { q:'Who signs and decides on bank matters?', opts:['Anil Kapadia','Mrs Hetal Shah','The European buyer','The branch manager'], key:1, critical:true, why:'Anil talks, but Mrs Shah handles finance and signs.' },
        { q:'By how much did turnover grow from FY25 to FY26?', opts:['About 10%','About 18%','About 22%','About 40%'], key:2, why:'₹18 Cr → ₹22 Cr is about 22%.' },
        { q:'What should you flag as the main risk?', opts:['90-day buyer credit vs 30-day supplier payment: a cash gap','Partners do not get along','Turnover is falling','Too many bank accounts'], key:0, critical:true },
        { q:'What is the best goal for this meeting?', opts:['Sell a credit card','Agree the funding need and collect documents for a quick proposal','Discuss the cheque return from 2023','Ask them to close the other bank account today'], key:1, critical:true },
        { q:'Which product fits best?', opts:['Export packing credit plus post-shipment finance','Personal loan','Fixed deposit','Gold loan'], key:0 },
       ]},
     { title:'Trident Chemicals Ltd · Vadodara', body:`CRM NOTE (15 Sep): CFO Meena Iyer wants to set up a new reactor line for two pharma clients. Project cost ₹9 Cr; promoter contribution ₹2.5 Cr.\n\nFINANCIALS: Turnover ₹54 Cr (FY25) → ₹64 Cr (FY26). EBITDA margin steady at 14%.\n\nMEETING NOTE (5 Sep): MD Mr S. Raghavan joins only for final discussions and takes the final call. Prefers short, numbers-first meetings.\n\nBRANCH NOTE: Banks with two other banks; unhappy with turnaround times. Current account with us since 2020, good balances.\n\nEMAIL (11 Sep, Meena): "Our clients expect supplies from April. We need the term loan sanctioned by December. Please also suggest how to manage import payments for the reactor."`,
       qs:[
        { q:'What does the customer need most right now?', opts:['A term loan for the new reactor line','A savings account for staff','An overdraft against FD','A credit card for the MD'], key:0 },
        { q:'Who takes the final decision?', opts:['CFO Meena Iyer','MD Mr S. Raghavan','The pharma clients','The other banks'], key:1, critical:true },

       qs:[

        { q:'Who takes the final decision?', opts:['Anna Mathew','Joseph Mathew','The Gulf buyers','The branch'], key:1, critical:true },

        { q:'What should you flag as the main risk?', opts:['Currency loss on USD receivables (₹18 lakh last year)','Too many staff','Falling turnover','No exports'], key:0, critical:true },

        { q:'Which extra product fits best?', opts:['Forward contracts to hedge USD','Gold loan','Home loan','Personal loan'], key:0 },
       ]},
   ][v];
     return { type:'mcq', prompt:'Read the customer file, then answer all 6 questions.', doc:{ title:D.title, body:D.body }, qs: D.qs.map((q, i) => ({ id:'q' + i, ...q })) }; } },

 { id:'t3', name:'Book Detective', skill:'Analyse your portfolio', format:'Number puzzle', type:'data', bench:25, work:60, freq:1,
   pitch:'Your book of 12 customers has hidden risks and opportunities. Find them.',
   build(v){ const r = rngOf(500 + v * 37), pool = shuffle([...CUST[v], ...CUST[(v + 1) % 3].slice(0, 4)], 70 + v).slice(0, 12);

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function skin(str, ind, extra = {}){
  const V = { ...INDUSTRIES[ind] || INDUSTRIES.banking, ...extra };
  return String(str).replace(/\{(\w+)\}/g, (m, k) => {
    const o = k.match(/^[oO]rg(\d)$/); if (o) return V.orgs[(+o[1] - 1) % V.orgs.length];
    if (V[k] !== undefined) return V[k];
    const lk = k[0].toLowerCase() + k.slice(1); if (k[0] === k[0].toUpperCase() && V[lk] !== undefined) return cap(V[lk]);
    return m; });
}

function longMail(text, from, key, i){

function boardModel(B, v, ind, S){
  const r = rngOf(700 + v * 31 + hashOf(B.ent) % 97), names = shuffle(FIRST.slice(0, 40), 50 + v).slice(0, 8), [lo, hi] = B.range, whole = !!B.whole;

  const weak = 1 + v * 2, slow = (weak + 3) % 8, low2 = (weak + 5) % 8;

  else { rows[weak].a = round(rows[weak].t * .62); rows[low2].a = round(rows[low2].t * .74); }
  rows[slow].tat = 12 + v;
  const T = rows.reduce((a, x) => a + x.t, 0), Ac = rows.reduce((a, x) => a + x.a, 0), pctA = Math.round(Ac / T * 1000) / 10;
  const bad = x => B.over ? x.a / x.t > 1.2 : x.a / x.t < .8, nBad = rows.filter(bad).length, gap = Math.round(Math.abs(T - Ac) * 10) / 10;
  const ch = (c, o, s) => { const opts = shuffle([c, ...o.filter(x => x !== c).filter((x, i, a) => a.indexOf(x) === i).slice(0, 3)], s); return { opts, key: opts.indexOf(c) }; };
  const ns = rows.map(x => x.nm);

    table:{ cols:[S(B.ent), S(B.tgt), S(B.act), S(B.tat), S(B.cnt)], rows: rows.map(x => [x.nm, whole ? x.t : x.t.toFixed(1), whole ? x.a : x.a.toFixed(1), x.tat, x.c]) },
    qs:[
      { id:'q0', kind:'num', q:`Overall ${B.over ? 'spend as % of budget' : 'achievement %'} (total of column 3 ÷ total of column 2)?`, key:pctA, tol:1, round:.15, unit:'%' },
      { id:'q1', kind:'choice', q: B.over ? 'Which one is most over budget?' : 'Which one has the lowest achievement?', ...ch(rows[weak].nm, shuffle(ns, 3 + v), 61 + v) },
      { id:'q2', kind:'choice', q:`Which one has the highest "${S(B.tat)}"?`, ...ch(rows[slow].nm, shuffle(ns, 5 + v), 71 + v) },
      { id:'q3', kind:'num', q: B.over ? 'How many are more than 20% over budget?' : 'How many are below 80% achievement?', key:nBad, tol:0 },
      { id:'q4', kind:'num', q: B.over ? 'Total overspend (column 3 − column 2)?' : 'Total gap to target (column 2 − column 3)?', key:gap, tol: Math.max(1, Math.round(gap * .02)), round:.05 },
      { id:'q5', kind:'choice', q:'Where should you act first?', reco:true, why:'The biggest gap needs attention first.', ...ch(rows[weak].nm + (B.over ? ': most over budget' : ': lowest achievement'), [rows[slow].nm + ': slowest', rows[(weak + 1) % 8].nm + ': average', rows[low2].nm + ': second gap'], 81 + v) },
    ] };
}

const PACKS = {};

function getPack(key){
  if (PACKS[key]) return PACKS[key];
  if (key === 'RM') return RM_LIST; if (key === 'TH') return TH_LIST;
  const { dept, ind, lvl } = parseKey(key);
  let p;

  return (PACKS[key] = p);
}

// ===================== Scoring =====================
function timeScore(sec, bench){ const r = sec / 60 / bench; if (r <= .35) return 100; if (r >= 1.6) return 25; return Math.round(100 - (r - .35) / 1.25 * 75); }
const taskTotal = s => Math.round(.35 * s.acc + .30 * s.qual + .15 * s.comp + .20 * s.time);
const starsOf = t => t >= 85 ? 3 : t >= 65 ? 2 : t >= 40 ? 1 : 0;
const xpOf = t => t + (t >= 85 ? 50 : t >= 70 ? 25 : 0);
const MEASURES = [
  { k:'time', name:'Time Taken',      unit:'min', hint:'Minutes to finish all 10 tasks' },
  { k:'comp', name:'Completion Rate', unit:'%',   hint:'How much of each task was finished' },
  { k:'acc',  name:'Accuracy',        unit:'%',   hint:'Right answers and right facts' },
  { k:'qual', name:'Output Quality',  unit:'%',   hint:'Critical items, structure, tone' },
];

function roundStats(round, role){
  if (!round) return null;
  const ex = EXERCISES[role], done = ex.filter(e => round.tasks?.[e.id]?.s);
  if (!done.length) return { done:0, total:ex.length, complete:false };
  const avg = k => Math.round(done.reduce((a, e) => a + round.tasks[e.id].s[k], 0) / done.length);
  const sec = done.reduce((a, e) => a + round.tasks[e.id].sec, 0);
  return { done: done.length, total: ex.length, complete: done.length === ex.length, min: Math.round(sec / 6) / 10, comp: avg('comp'), acc: avg('acc'), qual: avg('qual'), time: avg('time'), score: avg('total'),
    xp: done.reduce((a, e) => a + xpOf(round.tasks[e.id].s.total), 0) };
}
const roundsOf = u => (u.rounds || []);
const activeRound = u => roundsOf(u).find(r => !r.done) || null;
function bestLater(u){ const rs = roundsOf(u).filter(r => r.n > 1 && r.done); if (!rs.length) return null;
  return rs.map(r => ({ r, s: roundStats(r, u.role) })).sort((a, b) => b.s.score - a.s.score)[0]; }

function personROI(u, cfg, adopt = cfg.adopt / 100, real = cfg.real / 100){
  const r1 = roundsOf(u).find(r => r.n === 1 && r.done), later = roundsOf(u).filter(r => r.n > 1);
  if (!r1 || !later.length) return null;
  let weekly = 0, cuts = [], tasks = [];
  EXERCISES[u.role].forEach(e => {
    const pre = r1.tasks?.[e.id]; if (!pre?.sec) return;
    const posts = later.map(r => r.tasks?.[e.id]).filter(t => t?.sec && t.s.acc >= 50);
    if (!posts.length) return;
    const post = Math.min(...posts.map(t => t.sec));
    const cut = Math.max(0, Math.min(.9, 1 - post / pre.sec)), w = exWork(cfg, u.role, e.id);
    weekly += cut * w.work * Math.min(w.freq, 20); cuts.push(cut); tasks.push({ id:e.id, pre: pre.sec / 60, post: post / 60, cut });
  });
  if (!cuts.length) return null;
  const gross = weekly * cfg.weeks / 60, cons = gross * adopt * real;
  return { weekly, cut: cuts.reduce((a, b) => a + b, 0) / cuts.length, gross, cons, grossDays: gross / cfg.hrsDay, consDays: cons / cfg.hrsDay, tasks };
}

function rewardsOf(u, cfg){
  const rs = roundsOf(u), role = u.role; let xp = 0, maxAvg = 0, speed = false; const typeBest = {};
  rs.forEach(r => { const s = roundStats(r, role); if (!s || !s.done) return; xp += s.xp + (r.done ? 100 : 0); if (r.done) maxAvg = Math.max(maxAvg, s.score);

  const roi = personROI(u, cfg); if (roi?.tasks.some(t => t.cut >= .6)) speed = true;

// ===================== Basics =====================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = (n, d = 0) => Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits:d, minimumFractionDigits:d });
const pct = n => Math.round((n || 0) * 100) + '%';
const rupees = n => n >= 1e7 ? '₹' + fmt(n / 1e7, 2) + ' Cr' : n >= 1e5 ? '₹' + fmt(n / 1e5, 1) + ' L' : '₹' + fmt(n);
const mmss = sec => { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };
const first = n => String(n || '').split(' ')[0];
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2800); }
function copyText(t, ok){ const fall = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(ok); } catch(e){ toast('Copy not available here'); } ta.remove(); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(() => toast(ok)).catch(fall); else fall(); }
async function saveFile(name, data, type){ try { const b = new Blob([data], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); toast('Downloaded ' + name); } catch(e){ toast('Download did not start'); } }

function navFor(u){
  if (!u) return [];
  if (u.role === 'ADMIN') return [['impact','Impact Dashboard'],['business','Business Head View'],['board','Leaderboard'],['admin','Control Room']];
  if (u.role === 'LND') return [['impact','Impact Dashboard'],['business','Business Head View'],['board','Leaderboard']];
  if (u.role === 'BH') return [['business','Business Head View'],['impact','Impact Dashboard'],['board','Leaderboard']];
  return [['home','My Challenge'],['board','Leaderboard'],['rewards','Rewards']];
}
function testState(u){
  const act = activeRound(u), n = roundsOf(u).length;
  if (act) return { label:`Continue ${ROUNDS[act.n - 1].name}`, ok:true, cont:true };
  if (n >= ROUNDS.length) return { label:'See my rewards', ok:true, rewards:true };
  if (!S.cfg.rounds[n]) return { label:`${ROUNDS[n].name} opens after training`, ok:false };
  return { label: `Start ${ROUNDS[n].name}`, ok:true };
}

  el.innerHTML = `<div class="top-in">

function taskText(m){
  const L = [m.prompt, ''];
  if (m.doc) L.push(m.doc.title, m.doc.body, '');
  if (m.case) L.push('Facts:', ...m.case.map(x => '- ' + x), '');
  if (m.facts && m.type === 'spot') L.push('Fact card:', ...m.facts.map(x => '- ' + x), '', 'Draft email:', ...m.lines.map((l, i) => `${i + 1}. ${l.text}`));
  if (m.items && m.type === 'sort') { m.items.forEach((it, i) => L.push(`EMAIL ${i + 1}\nFrom: ${it.from}\nSubject: ${it.subject}\n${it.text}`, '')); L.push('Folders: ' + m.buckets.join(' / ')); }
  if (m.type === 'fill') L.push('Note with blanks:', m.parts.map(p => typeof p === 'string' ? p : `[${p.label}: ${p.opts.join(' / ')}]`).join(''));
  if (m.type === 'dialogue') L.push(`Chat with ${m.who} (${m.biz}). For each message choose the best reply:`, ...m.turns.flatMap((t, i) => [`Message ${i + 1}: ${t.msg}`, ...t.opts.map((o, j) => `  ${'ABC'[j]}. ${o.t}`)]));
  if (m.type === 'slot') { L.push(`Day: ${m.day}. Slots: ` + m.slots.map(x => x.label + (x.locked ? ` (blocked: ${x.locked})` : '')).join(', '), 'Items to place:'); m.items.forEach((x, i) => L.push(`${i + 1}. ${x.text}`)); }
  if (m.table) L.push(m.table.cols.join(' | '), ...m.table.rows.map(r => r.join(' | ')), '');
  if (m.qs) m.qs.forEach((q, i) => L.push(`Q${i + 1}. ${q.q}${q.opts ? ' Options: ' + q.opts.join(' / ') : ''}`));
  if (m.left) { m.left.forEach((x, i) => L.push(`${i + 1}. ${x.text}`)); L.push('', 'Choices: ' + m.right.join(' / ')); }
  if (m.type === 'pick') m.items.forEach((x, i) => L.push(`${i + 1}. ${x.text}`));
  if (m.type === 'rank') m.items.forEach((x, i) => L.push(`- ${x.text}`));
  return L.join('\n');
}

  const facts = (title, list) => `<div class="facts"><b>${esc(title)}</b><ul>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  let h = '';
  if (m.type === 'sort' && !m.inbox) h = `<div class="qlist">${m.items.map((it, i) => `<div class="q"><div class="mail"><span class="from">${i + 1}. From: ${esc(it.from)}</span><span class="subj">${esc(it.subject)}</span><p>${esc(it.text)}</p></div><div class="opts">${m.buckets.map((bk, bi) => opt(it.id, bi, bk, ans[it.id])).join('')}</div></div>`).join('')}</div>`;
  if (m.type === 'mcq') h = `<div class="split"><div class="doc stick"><h3>${esc(m.doc.title)}</h3>${esc(m.doc.body)}</div><div class="qlist">${m.qs.map((q, i) => `<div class="q"><span class="qt">${i + 1}. ${esc(q.q)}</span><div class="opts">${q.opts.map((o, oi) => opt(q.id, oi, o, ans[q.id], true)).join('')}</div></div>`).join('')}</div></div>`;
  if (m.type === 'data') h = `<div class="dtable"><table><thead><tr>${m.table.cols.map((c, i) => `<th class="${i ? 'n' : ''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${m.table.rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'n' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="grid g2">${m.qs.map((q, i) => `<div class="q"><span class="qt">${i + 1}. ${esc(q.q)}</span>${q.kind === 'num' ? `<input data-num="${q.id}" inputmode="decimal" placeholder="Type a number${q.unit ? ' (' + q.unit + ')' : ''}" value="${esc(ans[q.id] ?? '')}">` : `<div class="opts">${q.opts.map((o, oi) => opt(q.id, oi, o, ans[q.id], true)).join('')}</div>`}</div>`).join('')}</div>`;

function winsFeed(limit){
  const out = [];
  people().forEach(u => { roundsOf(u).filter(r => r.n > 1).forEach(r => { const r1 = roundByN(u, 1);
    EXERCISES[u.role].forEach(e => { const t = r.tasks?.[e.id], p = r1?.tasks?.[e.id]; if (t?.s && p?.sec && t.end){ const cut = 1 - t.sec / p.sec; if (cut >= .4) out.push({ u, e, cut, at: t.end }); } }); }); });
  const seen = new Set(); return out.sort((a, b) => b.at - a.at).filter(w => { if (seen.has(w.u.empId)) return false; seen.add(w.u.empId); return true; }).slice(0, limit);
}
function measureTiles(a, b){
  return MEASURES.map(x => { const from = a?.[x.k === 'time' ? 'min' : x.k], to = b?.[x.k === 'time' ? 'min' : x.k];
    const good = x.k === 'time' ? to < from : to > from, d = x.k === 'time' ? Math.round((1 - to / from) * 100) : Math.round(to - from);
    return `<div class="tile"><span class="lbl">${x.name}</span>${b && a ? `<div class="ba"><span class="from">${fmt(from, x.k === 'time' ? 0 : 0)}${x.unit === '%' ? '%' : ''}</span><span class="arrow">→</span><span class="to">${fmt(to)}${x.unit === '%' ? '%' : ''}</span></div>
      <span class="delta ${good ? '' : 'neg'}">${x.k === 'time' ? (good ? '▼ ' + d + '% less time' : '▲ more time') : (d >= 0 ? '▲ +' + d + ' pts' : '▼ ' + d + ' pts')}</span>`
      : `<span class="big">${a ? fmt(a[x.k === 'time' ? 'min' : x.k], x.k === 'time' && a.min < 10 ? 1 : 0) + (x.unit === '%' ? '%' : '') : '—'}</span><span class="sub">${x.k === 'time' ? 'minutes for all 10 tasks' : x.hint}</span>`}</div>`; }).join('');
}

function analyse(list, cfg = S.cfg){
  const rows = list.map(u => { const r1 = roundStats(roundByN(u, 1), u.role), b = bestLater(u), roi = personROI(u, cfg); return { u, r1: r1?.complete ? r1 : null, best: b?.s || null, roi, rw: rewardsOf(u, cfg) }; });
  const both = rows.filter(r => r.r1 && r.best), withRoi = rows.filter(r => r.roi);
  const avg = (arr, f) => arr.length ? arr.reduce((a, x) => a + f(x), 0) / arr.length : 0;
  const pre = {}, post = {}; ['min','comp','acc','qual','score'].forEach(k => { pre[k] = avg(both, r => r.r1[k]); post[k] = avg(both, r => r.best[k]); });
  const tasks = EXERCISES[F.role].map(e => { const pr = [], po = [], sc = { comp:[], acc:[], qual:[], time:[] };
    rows.forEach(r => { const a = roundByN(r.u, 1)?.tasks?.[e.id], later = roundsOf(r.u).filter(x => x.n > 1).map(x => x.tasks?.[e.id]).filter(t => t?.s);
      if (a?.sec && later.length){ pr.push(a.sec / 60); const bt = later.sort((x, y) => y.s.total - x.s.total)[0]; po.push(Math.min(...later.map(t => t.sec)) / 60); Object.keys(sc).forEach(k => sc[k].push(bt.s[k])); } });
    const m = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    return { e, n: pr.length, pre: m(pr), post: m(po), cut: m(pr) ? 1 - m(po) / m(pr) : 0, comp: m(sc.comp), acc: m(sc.acc), qual: m(sc.qual), time: m(sc.time) }; });
  return { rows, both, n: rows.length, r1: rows.filter(r => r.r1).length, r2: rows.filter(r => roundsOf(r.u).some(x => x.n === 2 && x.done)).length, r3: rows.filter(r => roundsOf(r.u).some(x => x.n === 3 && x.done)).length,
    pre, post, days: avg(withRoi, r => r.roi.consDays), gross: avg(withRoi, r => r.roi.grossDays), hrs: avg(withRoi, r => r.roi.cons), cut: avg(withRoi, r => r.roi.cut), tasks,
    flags: rows.filter(r => roundsOf(r.u).some(x => Object.values(x.tasks || {}).some(t => t.flag))).length };
}

// ===================== Confetti =====================
function confetti(n){
  if (reduced()) return; const cv = $('confetti'), cx = cv.getContext('2d'), dpr = devicePixelRatio || 1; cv.hidden = false;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr, cs = getComputedStyle(document.documentElement);
  const cols = ['--gold-2','--teal','--saffron','--indgreen','--navy2'].map(k => cs.getPropertyValue(k).trim() || '#E2AE45');
  const P2 = Array.from({ length:n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .4, y: H * .3, vx: (Math.random() - .5) * 20 * dpr, vy: (-Math.random() * 16 - 6) * dpr, r: (5 + Math.random() * 5) * dpr, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function f(t){ const el = t - t0; cx.clearRect(0, 0, W, H); P2.forEach(p => { p.vy += .45 * dpr; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.globalAlpha = Math.max(0, 1 - el / 2400); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); });
    if (el < 2400) requestAnimationFrame(f); else { cx.clearRect(0, 0, W, H); cv.hidden = true; } })(t0);
}

function columnChart(groups, series, opt = {}){

function scoreTiles(a, b){
  return MEASURES.map(x => { const key = x.k === 'time' ? 'min' : x.k, from = a?.[key], to = b?.[key];
    if (a && b){ const up = x.k !== 'time', d = up ? Math.round(to - from) : Math.round((1 - to / from) * 100), k = up ? ragOf(d, 8, 0) : ragOf(d, 40, 15);
      return `<div class="kpi2 ${k}"><div class="spread"><span class="lbl">${x.name}</span>${smile(k, 30)}</div><div class="ba"><span class="from">${x.k === 'time' ? fmt(from) : fmt(from) + '%'}</span><span class="arrow">→</span><span class="to">${x.k === 'time' ? (to < 10 ? mmss(to * 60) : fmt(to) + ' min') : fmt(to) + '%'}</span></div><span class="sub">${arrowOf(k !== 'r', up ? d >= 0 : false)} ${up ? (d >= 0 ? '+' : '') + d + ' points' : d + '% less time'} · ${RAGT[k]}</span></div>`; }
    if (a){ const val = a[key], k = x.k === 'time' ? 'a' : ragOf(val, 80, 60);
      return `<div class="kpi2 ${k}"><div class="spread"><span class="lbl">${x.name}</span>${smile(k, 30)}</div><span class="big">${x.k === 'time' ? (val < 10 ? mmss(val * 60) : fmt(val) + ' min') : fmt(val) + '%'}</span><span class="sub">Base Camp · ${x.k === 'time' ? 'beat it at Summit' : RAGT[k]}</span></div>`; }
    return `<div class="kpi2 none"><span class="lbl">${x.name}</span><span class="big muted">—</span><span class="sub">${x.hint}</span></div>`; }).join('');
}

  $('a-exp').onclick = () => saveFile(`time-back-360-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S), 'application/json');
  $('a-imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (d.v !== 7 || !d.users) throw 0; const sess = S.session; S = d; S.session = S.users[sess] ? sess : 'ADMIN'; SETUP = null; persist(true); render(); toast('Backup restored'); } catch(err){ toast('That file is not a valid backup'); } }; rd.readAsText(f); };
  const confirmBox = (msg, fn) => { $('a-confirm').innerHTML = `<div class="banner spread" style="margin-top:12px"><span>${msg}</span><span class="row"><button class="btn sm" id="c-no">Cancel</button><button class="btn sm gold" id="c-yes">Yes, continue</button></span></div>`; $('c-no').onclick = () => $('a-confirm').innerHTML = ''; $('c-yes').onclick = fn; };
  $('a-clear').onclick = () => confirmBox('Remove all sample people? Real profiles stay.', () => { Object.keys(S.users).forEach(k => { if (S.users[k].sample) delete S.users[k]; }); persist(true); render(); toast('Sample people removed'); });
  $('a-reset').onclick = () => confirmBox('Reset everything to the demo data for this client? All real results on this computer will be deleted.', () => { const sess = S.session; S = freshStore(S.cfg); S.session = S.users[sess] ? sess : 'ADMIN'; SETUP = null; persist(true); render(); toast('Demo data restored'); });
}

// ===================== Boot =====================
(function boot(){
  const u = me(); view = u ? (u.role === 'BH' ? 'business' : isStaff(u) ? 'impact' : 'home') : 'login';
  render();
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden){ $('overlay').hidden = true; $('overlay').innerHTML = ''; } });
})();

</script>
